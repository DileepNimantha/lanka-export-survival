[project]
name = "lanka-export-survival"
version = "0.1.0"
description = "Sri Lanka export survival prediction with an end-to-end MLOps pipeline"
requires-python = ">=3.12,<3.13"
# Only what the serving container needs. Training and tooling live in the groups below.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pandas>=2.2",
    "azure-monitor-opentelemetry>=1.6",
    "interpret-core>=0.7",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
ml = [
    "pandera>=0.24",
    "shap>=0.46",
    "matplotlib>=3.9",
    "mlflow>=3.1,<4",
    "dvc>=3.50",
    "evidently>=0.7,<0.8",
    "pyyaml>=6",
    "azure-monitor-query>=1.4",
    "azure-identity>=1.19",
    "httpx>=0.27",
]
dev = ["pytest>=8", "ruff>=0.8"]
ui = ["streamlit>=1.40", "httpx>=0.27"]

[tool.uv]
# `uv sync` installs everything for development; the Docker image uses --no-default-groups.
default-groups = ["ml", "ui", "dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
