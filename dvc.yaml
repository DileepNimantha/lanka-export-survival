stages:
  download:
    cmd: uv run python -m src.download
    deps:
      - src/download.py
    params:
      - data.url
      - data.exporter_code
      - data.raw
      - data.products
      - data.countries
    outs:
      - data/raw/sl_exports.csv
      - data/raw/product_codes.csv
      - data/raw/country_codes.csv

  prepare:
    cmd: uv run python -m src.data
    deps:
      - src/data.py
      - data/raw/sl_exports.csv
      - data/production/labelled.csv
    params:
      - data
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/eval.csv
      - data/processed/future.csv

  catalog:
    cmd: uv run python -m src.catalog
    deps:
      - src/catalog.py
      - src/data.py
      - data/raw/sl_exports.csv
      - data/raw/product_codes.csv
      - data/raw/country_codes.csv
    params:
      - data.catalog
    outs:
      - data/catalog/flows.csv

  train:
    cmd: uv run python -m src.train
    deps:
      - src/train.py
      - data/processed/train.csv
    params:
      - model
    outs:
      - models/model.joblib
      - run_info.json:
          cache: false

  evaluate:
    cmd: uv run python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/metrics.py
      - models/model.joblib
      - data/processed/eval.csv
    params:
      - evaluate.top_k_fraction
    metrics:
      - eval_metrics.json:
          cache: false
    plots:
      - plots/importance.png:
          cache: false

  explain:
    cmd: uv run python -m src.explain
    deps:
      - src/explain.py
      - models/model.joblib
      - data/processed/eval.csv
      - run_info.json
    params:
      - explain
    outs:
      - explain_summary.json:
          cache: false
    plots:
      - plots/explain:
          cache: false
