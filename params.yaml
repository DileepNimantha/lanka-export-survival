data:
  url: https://www.cepii.fr/DATA_DOWNLOAD/baci/data/BACI_HS12_V202601.zip
  exporter_code: 144     # Sri Lanka in BACI's country codes
  raw: data/raw/sl_exports.csv
  products: data/raw/product_codes.csv
  production: data/production/labelled.csv
  processed_dir: data/processed
  first_year: 2014       # needs two earlier years (2012, 2013) for the history features
  train_years: [2014, 2015, 2016, 2018]   # 2017 left out: BACI's 2018 data has a reporting dip, so many 2017 flows look like they stopped
  val_years: [2019]      # model selection and tuning
  test_years: [2020, 2021]    # final evaluation and the quality gate (eval.csv)
  future_years: [2022, 2023]  # "future" for the replayer: COVID recovery and the economic crisis
  holdout_frac: 0.3      # newest share of labelled production data used to judge retrained models
  drop_columns: ['value_next']   # next year's value is the answer itself, so it must never be a feature

model:
  name: lanka-export-survival   # name in the MLflow model registry
  experiment: lanka-export-survival
  cat_features: [hs_chapter, destination]
  catboost:
    iterations: 400
    learning_rate: 0.05
    depth: 6
    random_seed: 42

evaluate:
  top_k_fraction: 0.2    # analysts can only review the 20% of flows most at risk
  gate_metric: pr_auc    # metric a challenger must improve to replace the champion
  gate_min_delta: 0.0

monitor:
  drift_share_threshold: 0.3   # retrain when at least 30% of features have drifted...
  min_labelled_rows: 1000      # ...and we have enough labelled production rows to learn from
